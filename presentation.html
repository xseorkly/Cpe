<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Présentation CPE</title><link rel="stylesheet" href="v2.css"></head><body><div class="controls no-print"><a href="diaporamas.html" style="color:white">← Diaporamas</a><button id="prev">←</button><button id="next">→</button><span id="counter"></span><button id="screen">Plein écran</button><button onclick="window.print()">Imprimer / PDF</button></div><main id="slides"></main><script>const packs=[["Référentiel officiel 2026 : lire les compétences sans les simplifier",[["Pourquoi un nouveau référentiel ?","Annexe 32, arrêté du 20 mai 2026 ; cohérent avec le référentiel de compétences 2013 qui reste la référence professionnelle ; organisation des contenus de formation, de la licence aux trois années après titularisation."],["Quatre blocs interdépendants","1 · Organiser la vie scolaire, accompagner les parcours, contribuer au bien-être, à la sécurité et aux apprentissages.|2 · Adapter sa pratique au contexte et à la diversité.|3 · Agir dans le cadre des principes du service public.|4 · Se développer professionnellement."],["Bloc 1 · Huit domaines concrets","1.1 Encadrer, organiser, animer l'équipe.|1.2 Qualité des conditions de vie.|1.3 Respect des règles de vie et de droit.|1.4 Suivi individuel et collectif.|1.5 Construction des parcours.|1.6 Citoyenneté participative.|1.7 Information et communication.|1.8 Collaboration éducative."],["Bloc 2 · Adapter plutôt qu'appliquer mécaniquement","2.1 Culture de l'évaluation.|2.2 Diversité des élèves.|2.3 Diversité des contextes d'exercice.|En AEFE : besoins, cultures et dispositions locales vérifiées. Une adaptation éducative ne dispense jamais des exigences de protection."],["Bloc 3 · Le cadre commun de l'action","3.1 Principes et valeurs de la République.|3.2 Droits et obligations du fonctionnaire.|3.3 Système éducatif français.|3.4 Collectif et partenariats.|3.5 Relations avec les familles.|3.6 Protection de l'enfance."],["Bloc 4 · Développer ses compétences","4.1 S'appuyer sur une démarche de recherche.|4.2 Participer à un collectif professionnel.|4.3 Utiliser le numérique pour agir et se former.|Observer, expliciter, analyser, consulter, ajuster."],["Trois niveaux du continuum, pas trois notes du stage","Niveau 1 : entrée en master, savoirs académiques et enjeux du métier.|Niveau 2 : fin de master, mobilisation autonome dans la plupart des situations en collectif.|Niveau 3 : fin de formation continuée (3e année post-titularisation).|Notre formation de 12 h constitue une initiation, pas une certification du niveau 2 ou 3."],["Le fil conducteur de nos huit séquences","Posture → bloc 3 et bloc 4.|Organisation et AED → bloc 1 et bloc 2.|Adolescence et suivi → blocs 1 et 2.|Discipline et protection → blocs 1 et 3.|Démocratie → bloc 1.|Simulation et réflexivité → les quatre blocs."]]],["Les huit compétences spécifiques du CPE (2013)",[["C1 à C4 : politique éducative et vie scolaire","C1 Organiser les conditions de vie des élèves, leur sécurité, la qualité de l'organisation matérielle et la gestion du temps.|C2 Garantir, en lien avec les autres personnels, le respect des règles de vie et de droit.|C3 Impulser et coordonner le volet éducatif du projet d'établissement.|C4 Assurer la responsabilité de l'organisation et de l'animation de l'équipe de vie scolaire."],["C5 à C8 : accompagner et coopérer","C5 Accompagner le parcours de l'élève sur les plans pédagogique et éducatif.|C6 Accompagner les élèves, notamment dans leur formation à une citoyenneté participative.|C7 Participer à la construction des parcours des élèves.|C8 Travailler dans une équipe pédagogique."],["Appliquer les compétences à une journée de travail","Un AED absent : C1, C4.|Des absences qui augmentent : C5, C7, C8.|Des élèves élus qui proposent un projet : C3, C6.|Un incident avec une famille : C2, C5, C8.|Une situation appelle généralement plusieurs compétences simultanément."]]],["Bilan 1 · Identité, cadre, premières décisions",[["Le CPE : trois domaines, un travail collectif","Politique éducative ; suivi des élèves ; organisation de la vie scolaire.|Sous l'autorité du chef d'établissement, contribution à la conception et au fonctionnement éducatifs.|Ne pas se substituer à la direction, aux enseignants ou aux professionnels spécialisés."],["La bonne question avant d'agir","Quels faits ai-je ?|Quel cadre dois-je vérifier ?|Est-ce de ma compétence ?|Avec qui agir ?|Quelle trace et quel suivi ?|En AEFE, vérifier les règles et les interlocuteurs locaux."]]],["Bilan 2 · Organisation et pilotage",[["Du symptôme au diagnostic","Observer les temps, lieux et parcours des élèves.|Croiser retards, absences, incidents et observations qualitatives.|Vérifier les périodes, dénominateurs et modalités de recueil.|Distinguer une hypothèse de diagnostic d'un fait établi."],["Du diagnostic à une action évaluée","Deux ou trois priorités éducatives documentées.|Objectif, équipe, moyens, calendrier et transmissions.|Expérimenter puis réévaluer : indicateurs et perception des élèves et personnels.|Un planning n'est pas un projet éducatif."]]],["Bilan 3 · Encadrer les AED",[["Manager : donner du sens et du cadre","Accueillir, expliciter les missions et limites.|Réguler les pratiques à partir de faits.|Organiser des transmissions fiables et des réunions courtes, utiles et suivies.|Définir une progression professionnelle et vérifier le cadre d'emploi local."],["Entretien de régulation · les cinq gestes","Préparer des faits précis.|Accueillir la version de l'AED.|Rappeler le cadre et écouter les obstacles.|Définir actions, appuis, responsables et échéance.|Réévaluer sans humilier ou généraliser."]]],["Bilan 4 · Comprendre l'adolescent",[["Lire un comportement sans l'enfermer","Décrire le fait avant toute interprétation.|Envisager différentes causes possibles : contexte, pairs, appartenance, émotions, besoins et parcours.|Comprendre ne signifie ni excuser ni diagnostiquer.|Le cadre collectif, la sécurité et la juste distance restent essentiels."],["Réponse éducative graduée","Sécuriser et désamorcer si nécessaire.|Écouter ; rappeler les faits et les règles.|Proposer une suite compréhensible et proportionnée.|Prévoir un relais spécialisé lorsque nécessaire.|Observer la situation dans la durée."]]],["Bilan 5 · Suivi et alliance éducative",[["Derrière les indicateurs, une trajectoire","Croiser faits d'assiduité, observations et parole de l'élève.|Éviter l'explication unique et le jugement hâtif.|Préparer l'entretien et la relation aux familles.|Construire un plan d'action partagé, daté et réévalué."],["Une trace professionnelle utile","Motif, date, faits utiles, éléments recueillis, décisions, interlocuteurs et échéance.|Limiter le partage aux personnes habilitées.|Pas d'étiquette clinique, d'intention prêtée ou de détail intime superflu."]]],["Bilan 6 · Discipline et protection : ne pas confondre",[["Incident : une chaîne de décision juste","Vérifier les faits et la sécurité.|Déterminer compétence et cadre applicable.|Distinguer punition, sanction et démarche éducative.|Respecter proportionnalité, individualisation et contradictoire.|Prévoir un suivi."],["Situation préoccupante : quatre priorités","Protéger et écouter sans enquête solitaire.|Alerter et solliciter les acteurs compétents, secours si urgence.|Transmettre dans le circuit autorisé et conserver une trace factuelle.|Accompagner et vérifier le suivi.|Ne pas promettre le secret absolu ni imposer une médiation en cas de harcèlement présumé."]]],["Bilan 7 · Faire vivre la démocratie scolaire",[["Une démocratie réellement participative","Les élus consultent, débattent, argumentent et rendent compte.|Le CPE fournit méthode, cadre, interlocuteurs et formation.|Ne pas décider ou produire à leur place.|Vérifier compétences des instances AEFE et accompagner le retour aux élèves."]]],["Bilan 8 · Transfert et développement professionnel",[["La qualité du raisonnement avant la vitesse","Décrire faits et inconnues.|Prioriser la protection.|Choisir l'action dans son champ de compétence.|Communiquer et tracer.|Réévaluer si une pièce nouvelle apparaît."],["30 jours pour consolider les gestes","Semaine 1 : rencontrer et observer.|Semaine 2 : organiser l'équipe et les transmissions.|Semaine 3 : structurer le suivi et les partenariats.|Semaine 4 : bilan avec la direction, deux ou trois priorités mesurables."]]]];let params=new URLSearchParams(location.search),deck=Math.min(packs.length-1,Math.max(0,Number(params.get("deck"))||0)),n=0;let current=packs[deck];document.title=current[0]+" · CPE AEFE";let all=[["Présentation",current[0],"Formation CPE débutants · AEFE · Bilan et apports du formateur"],...current[1].map((s,i)=>["Diapositive "+(i+1),s[0],s[1]])];document.getElementById("slides").innerHTML=all.map((s,i)=>'<article class="slide'+(i===0?' active':'')+'"><div class="eyebrow">'+s[0]+'</div><h2>'+s[1]+'</h2>'+(i===0?'<p>'+s[2]+'</p>':'<ul>'+s[2].split("|").map(x=>'<li>'+x+'</li>').join("")+'</ul>')+'<div class="source">'+(deck===0?'Référentiel de formation CPE (2026), annexe 32.':deck===1?'Référentiel des compétences professionnelles (2013), C1 à C8.':'Synthèse pédagogique construite à partir du corpus CPE retenu.')+'</div></article>').join("");const slides=[...document.querySelectorAll(".slide")];function go(k){n=Math.max(0,Math.min(slides.length-1,k));slides.forEach((s,i)=>s.classList.toggle("active",i===n));document.getElementById("counter").textContent=(n+1)+" / "+slides.length;}document.getElementById("prev").onclick=()=>go(n-1);document.getElementById("next").onclick=()=>go(n+1);document.getElementById("screen").onclick=()=>document.documentElement.requestFullscreen?.();window.addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();go(n+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(n-1)}if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1)});if(params.has("print")){document.body.classList.remove("present");document.querySelector(".controls").style.display="none";slides.forEach(x=>x.classList.add("active"));}else document.body.classList.add("present");go(0);</script></body></html>
